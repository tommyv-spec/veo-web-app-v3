# Render.yaml - Render Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: veo-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    
    # Instance configuration
    #plan: starter  # $7/month - 512MB RAM, 0.5 CPU
    plan: standard  # $25/month - 2GB RAM, 1 CPU (recommended for production)
    
    # Auto-deploy from main branch
    branch: main
    
    # Health check — use / (serves static index.html, always fast)
    # instead of /api/health which imports veo_generator and can be slow
    # on a cold container. A fast health check helps Render mark the
    # service healthy sooner after a deploy, shrinking the 502 window.
    healthCheckPath: /
    
    # Environment variables (set these in Render dashboard for secrets)
    envVars:
      # Required: At least one Gemini API key
      - key: GEMINI_API_KEY_1
        sync: false  # Set in dashboard
      
      # Optional: Additional Gemini keys for load balancing
      # - key: GEMINI_API_KEY_2
      #   sync: false
      
      # Optional: OpenAI key for auto-split feature
      - key: OPENAI_API_KEY
        sync: false
      
      # Optional: Dedicated Gemini key for Nano Banana frame enhancement (continue mode)
      - key: NANO_BANANA_API_KEY
        sync: false
      
      # Optional: Replicate key for voice cloning (~$0.05/swap)
      - key: REPLICATE_API_TOKEN
        sync: false
      
      # Optional: ElevenLabs key for high-quality voice cloning
      - key: ELEVENLABS_API_KEY
        sync: false
      
      # Optional: DeepFilterNet on Modal for AI noise reduction
      # Default URL is hardcoded, only set this to override
      # - key: DEEPFILTER_MODAL_URL
      #   sync: false
      
      # Password protection (REQUIRED for private access)
      - key: SITE_PASSWORD
        sync: false  # Set in dashboard
      
      # Session configuration
      - key: SESSION_SECRET
        generateValue: true  # Auto-generate secure secret
      - key: SESSION_DURATION_HOURS
        value: "24"
      
      # Use secure cookies in production
      - key: SECURE_COOKIES
        value: "true"
      
      # Email alerts (optional)
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
      
      # Python settings
      - key: PYTHONUNBUFFERED
        value: "1"

      # v872 — glibc allocator caps. Authoritative copy lives in the Dockerfile
      # (applies even when this blueprint is not synced); mirrored here so the
      # deploy config shows them. See the Dockerfile comment for the why.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"

      # v872 — export admission gate. An export will not START unless the
      # container has this much headroom, measured against the cgroup limit
      # after a trim. Queued exports are durable (v850), so waiting costs
      # nothing; starting an export into 200MB of headroom costs the whole run.
      - key: EXPORT_MIN_AVAIL_MB
        value: "600"

      # v872 — idle worker recycle. When no export/job is running and RSS is
      # still above this, the worker exits and gunicorn respawns it, returning
      # the ratcheted heap to the OS. 0 disables.
      - key: RECYCLE_IDLE_RSS_MB
        value: "1000"

      # v773 — forced-alignment pipeline (MMS_FA + silero-VAD + distil-large-v3)
      # 1 = route detect_speech_segments_whisper to transcript_alignment module
      # 0 / unset = legacy V708/V731 Whisper-tiny fuzzy-match path
      - key: ALIGN_ENABLED
        value: "1"

      # v773.10.5 — pick alignment backend:
      #   whisper_anchor → reuse the Whisper-tiny model the caller pre-loads,
      #                    use first+last script word as trim anchors. Zero
      #                    new RAM, handles rare-vocab middle misses.
      #                    RECOMMENDED — fits 2 GB Render standard, uses
      #                    known-script anchoring (not pure silence cut).
      #   ffmpeg         → ffmpeg silencedetect only (silence cuts, no script).
      #   silero         → silero-VAD only (~2 MB model, no script).
      #   mms_fa         → torchaudio MMS-300M forced alignment (~1.5 GB peak,
      #                    needs Render 4 GB pro plan).
      - key: ALIGN_MODE
        value: "whisper_anchor"

      # v773.10.3 — cache torch model downloads on persistent disk so MMS-300M
      # doesn't re-download on every container restart (when ALIGN_MODE=mms_fa).
      - key: TORCH_HOME
        value: "/app/data/torch"
      - key: HF_HOME
        value: "/app/data/hf"

      # Job workers (parallel video generation)
      # Keep at 2 to avoid Veo API rate limits
      - key: MAX_JOB_WORKERS
        value: "5"

      # v773.11.0 — PostHog product analytics (autocapture + session replay).
      # POSTHOG_KEY = PUBLIC project API key (phc_...). Designed for browser
      # exposure; safe to expose via /api/posthog-config. Unset = analytics
      # bootstrap no-ops, so leaving this blank disables tracking cleanly.
      # POSTHOG_HOST = ingestion endpoint. Default is the US cloud; set to
      # https://eu.i.posthog.com for the EU region. Personal API keys for
      # querying live elsewhere (not needed by the running service).
      - key: POSTHOG_KEY
        sync: false  # Set in dashboard
      - key: POSTHOG_HOST
        value: "https://us.i.posthog.com"
    
    # Persistent disk for job data. Highly recommended: survives restarts
    # and redeploys, so /app/data/images/ doesn't need to be re-fetched
    # from R2 every time the container boots. Without this, every deploy
    # triggers a lazy-rehydration burst for any variant a user accesses,
    # competing with the server's ability to serve other requests. ~$0.25/mo
    # for 1GB.
    disk:
      name: veo-data
      mountPath: /app/data
      sizeGB: 1